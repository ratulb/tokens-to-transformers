<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav><a href="{{ '/' | relative_url }}#contents">Contents</a></nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>{{ site.title }} — a book in progress, written in public.
      Code: <a href="https://github.com/ratulb/mbpe">mbpe</a> · <a href="https://github.com/ratulb/tenmo">tenmo</a></p>
    </div>
  </footer>
</body>
</html>
