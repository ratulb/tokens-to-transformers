[workspace]
authors = ["Ratul Buragohain <ratul75@hotmail.com>"]
# modular-community carries the mbpe binary tenmo's build env needs.
#
# Always invoke tasks as `pixi run --frozen <task>`. `tenmo` is a git conda
# package pixi builds locally, so a bare `pixi run` rewrites its
# `conda_source` hash in pixi.lock on every call without changing the
# dependency. See validate/README.md section 9.
channels = ["https://conda.modular.com/max", "conda-forge", "https://repo.prefix.dev/modular-community"]
name = "tokens-to-transformers"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks]
validate = "pixi run mojo validate/ch01/validate_mbpe.mojo && pixi run python validate/ch01/validate_tiktoken.py && pixi run mojo validate/ch02/generate_ch02_numbers.mojo && pixi run mojo validate/ch03/generate_ch03_numbers.mojo && pixi run mojo validate/ch04/generate_ch04_numbers.mojo > validate/ch04/out/ch04_numbers.txt && pixi run python validate/ch04/check_top20.py"

[dependencies]
mojo = "1.1.0.*"
max = ">=26.5,<=26.6"
python = ">=3.14.6,<3.15"
tiktoken = "==0.12.0"
tenmo = { git = "https://github.com/ratulb/tenmo", rev = "8092e0e26" }

# Chapter 4: GPT-2 weights vehicle (converter) + independent reference.
# torch resolves to the CPU wheel via the extra index below.
[pypi-dependencies]
torch = "==2.12.0"
transformers = "==4.57.6"
safetensors = "==0.6.2"
huggingface-hub = ">=0.30"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]
