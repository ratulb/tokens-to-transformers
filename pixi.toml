[workspace]
authors = ["Ratul Buragohain <ratul75@hotmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "tokens-to-transformers"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[tasks]
validate = "pixi run mojo validate/ch01/validate_mbpe.mojo && pixi run python validate/ch01/validate_tiktoken.py"

[dependencies]
mojo = "1.1.0.*"
python = ">=3.14.6,<3.15"
tiktoken = "==0.12.0"
mbpe = { git = "https://github.com/ratulb/mbpe", rev = "ca06186383a9c9b47f3ca563b8038cffe51f0144" }
